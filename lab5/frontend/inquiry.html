<!DOCTYPE html>
<html>
<head>
    <title>Inquiry - StyleHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #fff5f7;
            color: #333;
        }

        header {
            background-color: #8b3a62;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        nav {
            background-color: #333;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        nav a:hover {
            color: #ffb6c9;
        }

        main {
            width: 80%;
            margin: 40px auto;
        }

        .form-section {
            background-color: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            color: #8b3a62;
            text-align: center;
            font-size: 30px;
        }

        .form-section > p {
            text-align: center;
        }

        form label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            resize: vertical;
        }

        .radio {
            margin-top: 10px;
        }

        .radio label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        .buttons input {
            background-color: #8b3a62;
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }

        .buttons input:hover {
            background-color: #6d2d4d;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        footer a {
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>STYLEHUB</h1>
        <p>Fashion That Defines You</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="inquiry.html">Inquiry</a>
        <a href="#">Women</a>
        <a href="#">Men</a>
        <a href="#">Sale</a>
    </nav>

    <main>

        <section class="form-section">

            <h2>Product Inquiry</h2>

            <p>
                Have a question about our products?
                Fill out the form below.
            </p>

            <form>

                <label for="name">Full Name:</label>
                <input type="text"
                       id="name"
                       placeholder="Enter your name"
                       required>

                <label for="email">Email Address:</label>
                <input type="email"
                       id="email"
                       placeholder="Enter your email"
                       required>

                <label for="phone">Phone Number:</label>
                <input type="tel"
                       id="phone"
                       placeholder="Enter your phone number">

                <label for="category">Product Category:</label>

                <select id="category">
                    <option>Select Category</option>
                    <option>Women's Clothing</option>
                    <option>Men's Clothing</option>
                    <option>Accessories</option>
                    <option>Shoes</option>
                </select>

                <label for="product">Product Name:</label>
                <input type="text"
                       id="product"
                       placeholder="Enter product name">

                <label for="message">Your Inquiry:</label>

                <textarea id="message"
                          rows="6"
                          placeholder="Write your inquiry here..."
                          required></textarea>

                <label>Preferred Contact Method:</label>

                <div class="radio">
                    <input type="radio"
                           id="emailContact"
                           name="contact">

                    <label for="emailContact">Email</label>

                    <input type="radio"
                           id="phoneContact"
                           name="contact">

                    <label for="phoneContact">Phone</label>
                </div>

                <div class="buttons">
                    <input type="submit" value="Submit Inquiry">
                    <input type="reset" value="Clear Form">
                </div>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 StyleHub. All Rights Reserved.</p>
        <a href="index.html">Home</a> |
        <a href="about.html">About Us</a>
    </footer>

</body>
</html>
