<!DOCTYPE html>
<html>
<head>
    <title>Inquiry - StyleHub</title>
</head>

<body style="margin:0; font-family:Arial; background-color:#fff5f7; color:#333;">

    <!-- Header -->
    <header style="background-color:#8b3a62; color:white; text-align:center; padding:25px;">
        <h1 style="margin:0; font-size:40px;">STYLEHUB</h1>
        <p style="font-size:18px;">Fashion That Defines You</p>
    </header>

    <!-- Navigation -->
    <nav style="background-color:#333; text-align:center; padding:15px;">
        <a href="index.html" style="color:white; text-decoration:none; margin:15px;">Home</a>
        <a href="about.html" style="color:white; text-decoration:none; margin:15px;">About Us</a>
        <a href="inquiry.html" style="color:white; text-decoration:none; margin:15px;">Inquiry</a>
        <a href="women.html" style="color:white; text-decoration:none; margin:15px;">Women</a>
        <a href="men.html" style="color:white; text-decoration:none; margin:15px;">Men</a>
        <a href="sale.html" style="color:white; text-decoration:none; margin:15px;">Sale</a>
    </nav>

    <!-- Inquiry Form -->
    <main style="width:60%; margin:40px auto;">

        <div style="background-color:white; padding:35px; border-radius:15px;
                    box-shadow:0 2px 10px #ccc;">

            <h2 style="text-align:center; color:#8b3a62; font-size:30px;">
                Product Inquiry
            </h2>

            <p style="text-align:center;">
                Have a question about our products? Fill out the form below.
            </p>

            <form>

                <label for="name"><b>Full Name:</b></label>
                <br>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name"
                       required
                       style="width:95%; padding:12px; margin-top:8px; border:1px solid #ccc; border-radius:5px;">

                <br><br>

                <label for="email"><b>Email Address:</b></label>
                <br>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email"
                       required
                       style="width:95%; padding:12px; margin-top:8px; border:1px solid #ccc; border-radius:5px;">

                <br><br>

                <label for="phone"><b>Phone Number:</b></label>
                <br>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter your phone number"
                       style="width:95%; padding:12px; margin-top:8px; border:1px solid #ccc; border-radius:5px;">

                <br><br>

                <label for="category"><b>Product Category:</b></label>
                <br>

                <select id="category" name="category"
                        style="width:99%; padding:12px; margin-top:8px; border:1px solid #ccc; border-radius:5px;">

                    <option value="">Select Category</option>
                    <option>Women's Clothing</option>
                    <option>Men's Clothing</option>
                    <option>Accessories</option>
                    <option>Shoes</option>
                </select>

                <br><br>

                <label for="product"><b>Product Name:</b></label>
                <br>

                <input type="text" id="product" name="product"
                       placeholder="Enter product name"
                       style="width:95%; padding:12px; margin-top:8px; border:1px solid #ccc; border-radius:5px;">

                <br><br>

                <label for="message"><b>Your Inquiry:</b></label>
                <br>

                <textarea id="message" name="message"
                          rows="6"
                          placeholder="Write your inquiry here..."
                          required
                          style="width:95%; padding:12px; margin-top:8px; border:1px solid #ccc; border-radius:5px;"></textarea>

                <br><br>

                <b>Preferred Contact Method:</b>

                <br><br>

                <input type="radio" id="emailContact"
                       name="contact" value="email">

                <label for="emailContact">Email</label>

                &nbsp;&nbsp;

                <input type="radio" id="phoneContact"
                       name="contact" value="phone">

                <label for="phoneContact">Phone</label>

                <br><br>

                <div style="text-align:center;">

                    <input type="submit"
                           value="Submit Inquiry"
                           style="background-color:#8b3a62; color:white;
                                  border:none; padding:12px 25px;
                                  border-radius:5px; cursor:pointer;">

                    <input type="reset"
                           value="Clear Form"
                           style="background-color:#555; color:white;
                                  border:none; padding:12px 25px;
                                  border-radius:5px; cursor:pointer;">

                </div>

            </form>

        </div>

    </main>

    <!-- Footer -->
    <footer style="background-color:#333; color:white; text-align:center; padding:20px;">
        <p>© 2026 StyleHub. All Rights Reserved.</p>

        <a href="index.html" style="color:white;">Home</a> |
        <a href="about.html" style="color:white;">About Us</a>
    </footer>

</body>
</html>
```
